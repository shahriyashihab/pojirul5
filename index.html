<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>মেসার্স ভাই ভাই ভুসি ও গো-খাদ্য ভাণ্ডার</title>
    <meta name="description" content="অনলাইন গো-খাদ্য স্টোর এবং প্রফেশনাল একাউন্টিং ও লেজার ম্যানেজমেন্ট সিস্টেম" />
    <meta property="og:title" content="মেসার্স ভাই ভাই ভুসি ও গো-খাদ্য ভাণ্ডার" />
    <meta property="og:description" content="অনলাইন গো-খাদ্য স্টোর এবং প্রফেশনাল একাউন্টিং ও লেজার ম্যানেজমেন্ট সিস্টেম" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="font-sans antialiased text-slate-800 bg-slate-50 selection:bg-emerald-600 selection:text-white">
    <div id="root">
      <div id="app-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Hind Siliguri', sans-serif; text-align: center; padding: 20px;">
        <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <h2 style="margin-top: 16px; font-size: 19px; font-weight: 700; color: #0f172a;">মেসার্স ভাই ভাই ভুসি ও গো-খাদ্য ভাণ্ডার</h2>
        <p id="loader-status" style="margin-top: 6px; font-size: 13px; color: #64748b;">লোড হচ্ছে, অনুগ্রহ করে একটু অপেক্ষা করুন...</p>
        <button id="reload-btn" onclick="window.location.reload(true)" style="display:none; margin-top:16px; padding:8px 18px; background:#059669; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">
          পুনরায় লোড করুন (Reload)
        </button>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          if (!window.__APP_INITIALIZED__) {
            var st = document.getElementById('loader-status');
            var btn = document.getElementById('reload-btn');
            if (st) st.textContent = 'নেটওয়ার্ক বা ক্যাশ জনিত কারণে দেরি হচ্ছে। অনুগ্রহ করে পেজটি রিলোড করুন:';
            if (btn) btn.style.display = 'inline-block';
          }
        }, 4000);
      </script>
    </div>

    <!-- Vite Entrypoint (Required for AI Studio dev server and vite build) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Smart Static Hosting Bootstrapper (For Production, cPanel, Apache where /src/main.tsx cannot run) -->
    <script>
      (function() {
        var isDevServer = (
          window.location.port === '3000' ||
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname.indexOf('ais-dev') !== -1 ||
          window.location.hostname.indexOf('run.app') !== -1
        );

        // If NOT in AI Studio dev server (i.e. hosted on production Apache, custom domain):
        if (!isDevServer) {
          var v = Date.now();
          // Load precompiled CSS bundle immediately with cache-busting version
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = './assets/app.css?v=' + v;
          document.head.appendChild(l);

          // Load precompiled JS bundle immediately with cache-busting version
          var s = document.createElement('script');
          s.type = 'module';
          s.src = './assets/app.js?v=' + v;
          s.onerror = function() {
            var st = document.getElementById('loader-status');
            var btn = document.getElementById('reload-btn');
            if (st) st.textContent = 'জাভাস্ক্রিপ্ট লোড হতে সমস্যা হয়েছে। অনুগ্রহ করে পেজটি রিলোড করুন:';
            if (btn) btn.style.display = 'inline-block';
          };
          document.body.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
